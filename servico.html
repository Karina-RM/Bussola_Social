<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalhe do serviço — Bússola Social</title>
  <meta name="description" content="Detalhes do serviço público gratuito — endereço, horário, telefone e informações de procedência.">
  <meta property="og:title" content="Detalhe do serviço — Bússola Social">
  <meta property="og:description" content="Detalhes do serviço público gratuito no DF e Entorno.">
  <meta property="og:image" content="img/og-card.png">
  <meta property="og:url" content="https://bussolasocial.org/servico.html">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/componentes.css">
</head>
<body>
  <noscript>
    <main style="padding:2rem;font-family:sans-serif;text-align:center;">
      <h1 style="color:#B3252A;">Bússola Social</h1>
      <p>Serviços públicos gratuitos no DF e Entorno</p>
      <p>Este site precisa de JavaScript para funcionar. Ative o JavaScript no seu navegador.</p>
      <p style="font-weight:bold;margin-top:1.5rem;">Em emergência, ligue:</p>
      <p>SAMU <strong>192</strong> &nbsp;|&nbsp; Bombeiros <strong>193</strong> &nbsp;|&nbsp; CVV <strong>188</strong> (apoio emocional)</p>
    </main>
  </noscript>

  <a href="#conteudo-principal" class="pular-conteudo">Pular para o conteúdo</a>

  <header id="cabecalho"></header>

  <main id="conteudo-principal" role="main" tabindex="-1">
    <div class="conteiner">
      <div id="servico-detalhe">
        <div id="servico-carregando" class="servico-esqueleto">
          <div class="esqueleto-linha esqueleto-titulo"></div>
          <div class="esqueleto-linha esqueleto-badge"></div>
          <div class="esqueleto-linha esqueleto-texto"></div>
          <div class="esqueleto-linha esqueleto-texto"></div>
          <div class="esqueleto-linha esqueleto-texto esqueleto-curto"></div>
        </div>

        <div id="servico-conteudo" hidden>
          <button id="servico-voltar" class="servico-voltar" type="button">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M12 4L6 10L12 16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Voltar aos resultados
          </button>

          <div id="servico-cabecalho" class="servico-cabecalho"></div>

          <div id="servico-qr" class="servico-qr" hidden>
            <div id="servico-qr-codigo" class="servico-qr-codigo"></div>
            <div class="servico-qr-acoes">
              <p class="servico-qr-texto">Leia o QR code com seu celular para salvar estas informações.</p>
              <a id="servico-vcard" class="servico-qr-vcard" href="#" download>
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><circle cx="9" cy="9" r="8" stroke="currentColor" stroke-width="1.5"/><path d="M9 5v4M9 9h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M9 9H5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                Salvar contato
              </a>
            </div>
          </div>

          <dl id="servico-info" class="servico-info"></dl>

          <div id="servico-procedencia" class="servico-procedencia"></div>
        </div>

        <div id="servico-nao-encontrado" class="servico-vazio" hidden>
          <h2>Não encontramos esse serviço</h2>
          <p>O serviço que você procura pode ter sido removido ou o endereço pode estar incorreto.</p>
          <a href="index.html" class="servico-link-busca">Ver todos os serviços</a>
        </div>
      </div>
    </div>
  </main>

  <footer id="rodape"></footer>

  <script src="js/layout.js" defer></script>
  <script src="js/acessibilidade.js" defer></script>
  <script src="js/qrcode-vendor.js" defer></script>
  <script src="js/dados.js" defer></script>
  <script src="js/estado.js" defer></script>
  <script src="js/servico.js" defer></script>
</body>
</html>
